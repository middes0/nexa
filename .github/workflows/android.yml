name: Build NEXA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css script.js automation.js www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: |
          npx cap sync android

      - name: Enable exact Android alarms
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'

          if "android.permission.SCHEDULE_EXACT_ALARM" not in text:
              text = text.replace("<manifest", "<manifest\n" + permission, 1)

          manifest.write_text(text)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
